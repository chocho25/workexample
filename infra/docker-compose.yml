services:
  postgres:
    image: postgres:16-alpine
    container_name: workgeo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workgeo
      POSTGRES_PASSWORD: workgeo_dev
      POSTGRES_DB: workgeo
    ports:
      - "5432:5432"
    volumes:
      - workgeo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workgeo -d workgeo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  workgeo_pg_data:
